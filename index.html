<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stele</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
    }

    video, iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      border: none;
      background: black;
    }

    video {
      object-fit: cover;
    }

    #anny {
      display: none;
    }
  </style>
</head>

<body>

  <video id="video" autoplay muted playsinline>
    <source src="stele.mp4" type="video/mp4">
  </video>

  <iframe
    id="anny"
    src="https://panels.anny.co/347a5d68-5cb2-44c9-8b62-e242c587ed2d?secret=51TJuLKSrq2BjzcdNVLyfwiz7OgUNvMm">
  </iframe>

  <script>
    const video = document.getElementById("video");
    const anny = document.getElementById("anny");

    video.addEventListener("ended", function() {

      video.style.display = "none";
      anny.style.display = "block";

      setTimeout(function() {

        anny.style.display = "none";
        video.style.display = "block";

        video.currentTime = 0;
        video.play();

      }, 30000);

    });
  </script>

</body>
</html>
